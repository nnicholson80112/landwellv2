name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres that exists only inside this job, for tests/postgres.test.ts.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keyhelm
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: keyhelm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyhelm -d keyhelm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Not a secret: the database above is created for this job and deleted with it.
      PG_TEST_URL: postgres://keyhelm:ci-only-throwaway@localhost:5432/keyhelm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: Demo month runs with 0 failed workflows
        run: npm run demo | tee demo.txt && grep -q ", 0 failed)" demo.txt
