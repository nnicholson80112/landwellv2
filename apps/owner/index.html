<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today | KeyHelm</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12191B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KeyHelm">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* KeyHelm owner app. One file: no frameworks, no outside requests. Fonts are served from this site. */
@font-face{font-family:'Montagu Slab';font-style:normal;font-weight:500 700;font-display:swap;src:url(/fonts/montagu-slab-latin.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;font-display:swap;src:url(/fonts/figtree-latin.woff2) format('woff2')}
:root{
  --bg:#FFF6EC;--surface:#FFFDF9;--tint:#F6ECDF;--sun:#E8A33D;--sun-soft:#FCEBCB;--ink:#1E2B2F;--muted:#56636A;--line:#EADFD2;
  --brand:#C8502D;--brand-ink:#FFFFFF;--brand-deep:#A9401F;--mint:#0E9F6E;--mint-ink:#0B7A55;--mint-soft:#DDF6EC;--coral:#9A3412;--coral-soft:#FFE7DA;
  --side:#1E2B2F;--side-2:#26363B;--side-ink:#F3EEE7;--side-muted:#A5B0B3;
  --display:'Montagu Slab',Georgia,'Times New Roman',serif;--body:'Figtree','Segoe UI',system-ui,sans-serif;
  --nav-w:248px;--shadow:0 14px 34px -28px rgba(30,43,47,.55);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12191B;--surface:#1A2427;--tint:#1E2B2F;--sun-soft:#3A2E17;--ink:#F3EEE7;--muted:#A5B0B3;--line:#2B393D;
  --brand:#E0714D;--brand-ink:#12191B;--brand-deep:#EE8A68;--side:#0F1719;--side-2:#1A2427;--mint:#3DD39B;--mint-ink:#3DD39B;--mint-soft:#123A2D;--coral:#FF9B6B;--coral-soft:#3D2416;
  --shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-0.02em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:60;background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:10px;font-weight:700;border:2px solid var(--brand)}
.skip:focus{top:12px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- layout: bottom tabs on phones, side nav on wide screens ---------- */
.offline{position:sticky;top:0;z-index:40;background:var(--sun);color:#1E2B2F;font-weight:700;text-align:center;padding:10px 16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr)}
.nav li a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.01em}
.nav li a:hover{color:var(--ink)}
.nav li a[aria-current="page"]{color:var(--brand)}
.nav li a[aria-current="page"]::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.nav .count{position:absolute;top:6px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:var(--sun);color:#1E2B2F;font-size:12px;font-weight:800;line-height:20px;text-align:center}
.brand{display:none;align-items:center;gap:10px;font:800 22px var(--display);letter-spacing:-0.03em;color:var(--ink);text-decoration:none;min-height:48px;padding:0 10px;margin-bottom:18px}
.brand svg{width:32px;height:32px}
main{display:block;max-width:1000px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:6px}
.top .mark{width:30px;height:30px;flex:none}
.top h1{flex:1;font-size:clamp(28px,7vw,36px);font-weight:800}
@media (min-width:900px){
  .nav{top:0;right:auto;width:var(--nav-w);border-top:0;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column}
  .brand{display:flex}
  .nav ul{display:flex;flex-direction:column;gap:4px}
  .nav li a{flex-direction:row;justify-content:flex-start;gap:14px;min-height:50px;padding:0 14px;border-radius:10px;font-size:16px}
  .nav li a[aria-current="page"]{background:var(--tint)}
  .nav li a[aria-current="page"]::before{top:12px;bottom:12px;left:0;right:auto;width:4px;height:auto;border-radius:0 3px 3px 0}
  .nav .count{position:static;margin-left:auto}
  main{margin-left:var(--nav-w);margin-right:0;max-width:none;padding:26px 40px 56px}
  .view,.top{max-width:1040px}
  .top .mark{display:none}
}

/* ---------- building blocks ---------- */
.lead{font-size:18px;color:var(--muted);margin:0 0 18px}
.lead strong{color:var(--ink)}
.block{margin:26px 0}
.block>h2,.block-head h2{font-size:22px;font-weight:800;margin:0 0 12px}
.block-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.block-head h2{margin:0}
.stack{display:grid;gap:14px}
.plain{list-style:none;margin:0;padding:0}
.grid2{display:grid;gap:14px}
@media (min-width:700px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:19px;font-weight:700;margin:0 0 6px}
.card h4{font:700 15px var(--body);letter-spacing:0;margin:16px 0 6px;color:var(--muted);text-transform:uppercase}
.meta{color:var(--muted);font-size:15px}
.muted{color:var(--muted)}
.pre{white-space:pre-line}
.bad{color:var(--coral);font-weight:700}
.note{background:var(--sun-soft);border-radius:12px;padding:12px 14px;margin:10px 0}
.note.info{background:var(--tint)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:20px;color:var(--muted);background:var(--surface)}
.loading{color:var(--muted);padding:24px 0;font-weight:600}
.error-card{border-color:var(--coral)}
.error-card p{margin-bottom:12px;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--tint);color:var(--ink);font-size:13px;font-weight:700;line-height:20px;vertical-align:middle}
.tag.bad{background:var(--coral-soft);color:var(--coral)}
.tag.warn{background:var(--sun-soft);color:var(--ink)}
.tag.ok{background:var(--mint-soft);color:var(--mint-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:12px 0 0}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px}
.row-actions,.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.actions{margin-top:18px}
details.block>summary{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-weight:700;color:var(--brand);list-style:none}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary::before{content:'';width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.block[open]>summary::before{transform:rotate(45deg)}
.list li{padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;border:1.5px solid transparent;font:700 16px/1.2 var(--body);cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,border-color .15s}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 22px -12px var(--brand)}
.btn.primary:hover{background:var(--brand-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.sun{background:var(--sun);color:#1E2B2F;box-shadow:0 8px 22px -14px #B07A1F}
.btn.choice{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn.danger{background:var(--surface);color:var(--coral);border-color:var(--coral)}
.btn.big{min-height:56px;font-size:17px;padding:12px 22px}
.btn.icon-only{width:48px;padding:0}
.btn[disabled]{opacity:.65;cursor:progress}
.options{display:grid;gap:10px;margin-top:14px}
.options .btn{min-height:56px;font-size:17px;width:100%}
@media (min-width:560px){.options{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}

/* ---------- forms ---------- */
.form{display:grid;gap:4px}
.field{margin:12px 0 0;min-width:0}
.field>label,.field>.label,.field>legend{display:block;font-weight:700;margin:0 0 6px;padding:0}
.opt{font-weight:500;color:var(--muted)}
fieldset.field{border:0;padding:0;margin:14px 0 0;min-width:0}
fieldset.group{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px}
fieldset.group>legend{padding:0 6px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input[readonly]{background:var(--bg);color:var(--muted)}
[aria-invalid="true"]{border-color:var(--coral)!important}
.affix{display:flex;align-items:stretch}
.affix .prefix{display:flex;align-items:center;padding:0 12px;border:1.5px solid var(--line);border-right:0;border-radius:12px 0 0 12px;background:var(--bg);color:var(--muted);font-weight:700}
.affix input{border-radius:0 12px 12px 0!important}
.help{color:var(--muted);font-size:14px;margin:6px 0 0}
.err{color:var(--coral);font-weight:700;font-size:15px;margin:6px 0 0}
.form-err{background:var(--coral-soft);color:var(--coral);font-weight:700;border-radius:12px;padding:12px 14px;margin:0 0 6px}
.two{display:grid;gap:0 12px}
@media (min-width:520px){.two{grid-template-columns:1fr 1fr}}
.check{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;column-gap:8px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--brand)}
.check>label{margin:0;min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.check .help{grid-column:2;margin-top:0}
.radio{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;column-gap:8px}
.radio input{width:22px;height:22px;margin:0;accent-color:var(--brand)}
.radio label{min-height:48px;display:flex;flex-direction:column;justify-content:center;font-weight:600;cursor:pointer;padding:4px 0}
.radio .sub{font-weight:400;font-size:14px;color:var(--muted)}
.radios.inline{display:flex;flex-wrap:wrap;gap:0 20px}
.radios.inline>legend{width:100%}
.checks{display:grid;gap:0 12px}
@media (min-width:520px){.checks{grid-template-columns:1fr 1fr}}
.rows-ed{display:grid;gap:10px}
.row-ed{display:grid;gap:0 10px;align-items:end;border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px}
.row-ed .field{margin-top:8px}
@media (min-width:620px){.row-ed{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto}.row-ed.crit{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,.7fr) auto}}
.total{font-weight:700;margin:12px 0 0}
.form.card>h3{margin:24px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.form.card>h3:first-child{margin-top:0;padding-top:0;border-top:0}
.panel{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.confirm-q{font-weight:700;margin-top:10px}

/* ---------- Today ---------- */
.setup{border:2px solid var(--sun)}
.setup h2{font-size:22px;font-weight:800;margin-bottom:6px}
progress{display:block;width:100%;height:12px;margin:12px 0 4px;border:0;border-radius:6px;background:var(--tint);overflow:hidden;-webkit-appearance:none;appearance:none}
progress::-webkit-progress-bar{background:var(--tint);border-radius:6px}
progress::-webkit-progress-value{background:var(--mint);border-radius:6px}
progress::-moz-progress-bar{background:var(--mint);border-radius:6px}
.steps{list-style:none;margin:10px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.steps .done .tick{background:var(--mint);border-color:var(--mint);color:#fff}
.steps .done .step-title{color:var(--muted)}
.steps .tick .ic{width:18px;height:18px;stroke-width:3}
.steps li .btn{grid-column:2;justify-self:start}
@media (min-width:700px){.steps li{grid-template-columns:30px minmax(0,1fr) auto}.steps li .btn{grid-column:auto}}
.cta-row{margin-top:16px;display:grid;gap:8px;justify-items:start}
.decision .kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.decision .question{font-weight:800;font-size:17px;margin-top:14px}
.decision .body{margin-top:6px}
.task{display:grid;gap:4px}
.task.late{border-color:var(--coral)}
.task h3{font-size:17px}
.week li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.week .ic{color:var(--mint-ink);margin-top:1px}
.activity li{display:grid;gap:2px}

/* ---------- Rent, repairs, homes ---------- */
.charge.late{border-color:var(--coral);box-shadow:inset 5px 0 0 var(--coral)}
.amount{text-align:right}
.big-num{font:800 26px var(--display);letter-spacing:-0.02em}
.wo.urgent{border-color:var(--coral)}
.home-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tenants li{padding:12px 0;border-top:1px solid var(--line)}
.tenants li:first-child{border-top:0}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.person strong{font-size:17px}
.fields-found{columns:2;column-gap:20px;margin:8px 0 0;padding-left:20px}

/* ---------- Messages ---------- */
.msgs .thread-pane{display:none}
.msgs.open .list-pane{display:none}
.msgs.open .thread-pane{display:block}
.thread{display:grid;gap:3px;padding:14px 16px;min-height:72px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;margin-bottom:10px}
.thread:hover{border-color:var(--brand)}
.thread.active{border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.thread .who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.thread .name{font-weight:800;font-size:17px}
.thread .last{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread-head{display:grid;gap:4px;margin-bottom:10px}
.thread-head h2{font-size:24px;font-weight:800}
.thread-head .btn{justify-self:start}
.log{list-style:none;margin:10px 0;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.msg{max-width:min(560px,86%);padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.out{align-self:flex-end;background:var(--tint);border-color:transparent}
.msg.out.owner{background:var(--brand);color:var(--brand-ink)}
.msg.out.owner .msg-meta,.msg.out.owner a{color:var(--brand-ink)}
.msg-meta{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
.msg-body{white-space:pre-line;overflow-wrap:anywhere}
.pick{padding:30px 0}
@media (min-width:1100px){
  .msgs{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
  .msgs .list-pane,.msgs.open .list-pane{display:block;position:sticky;top:16px;max-height:calc(100vh - 120px);overflow:auto;padding-right:4px}
  .msgs .thread-pane{display:block}
  .thread-head .back{display:none}
  .log{max-height:calc(100vh - 380px);min-height:240px}
}

/* ---------- sheet (dialog), toasts ---------- */
dialog.sheet{width:min(640px,calc(100vw - 32px));max-width:none;max-height:min(92vh,920px);padding:0;border:0;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -30px rgba(30,43,47,.6)}
dialog.sheet::backdrop{background:rgba(30,43,47,.5)}
.sheet-inner{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 12px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:22px;font-weight:800}
.sheet-body{overflow:auto;padding:6px 20px 24px}
@media (max-width:640px){dialog.sheet{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:94vh}.sheet-body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.toasts{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toasts>div{display:grid;gap:8px;justify-items:center}
.toast{pointer-events:auto;max-width:520px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;box-shadow:0 14px 30px -14px rgba(30,43,47,.6)}
.toast.bad{background:var(--coral);color:#fff}
@media (min-width:900px){.toasts{left:auto;right:28px;bottom:28px;justify-items:end}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- KeyHelm look: dark slate side menu on wide screens, "More" on phones ---------- */
.nav li.extra{display:none}
.nav ul{grid-template-columns:repeat(5,1fr)}
.more-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;min-height:62px;padding:6px 2px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.more-list{display:grid;gap:6px}
.more-btn.on{color:var(--brand)}
.more-btn.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.more-list a{justify-content:flex-start;width:100%}
.more-list a[aria-current="page"]{border-color:var(--brand);color:var(--brand)}
@media (min-width:900px){
  .nav{background:var(--side);border-right:0}
  .nav li.extra{display:block}
  .nav li.more-li{display:none}
  .nav .brand{color:var(--side-ink)}
  .nav li a{color:var(--side-muted)}
  .nav li a:hover{color:var(--side-ink);background:var(--side-2)}
  .nav li a[aria-current="page"]{color:var(--side-ink);background:color-mix(in srgb,var(--brand) 26%,var(--side-2))}
}

/* ---------- leasing ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--tint);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.lane-h{display:flex;justify-content:space-between;gap:8px;font:800 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 4px}
.tile{padding:12px;display:grid;gap:6px}
.tile h4{font:700 16px var(--body);text-transform:none;letter-spacing:0;color:var(--ink)}
.tile.needs{box-shadow:inset 3px 0 0 var(--sun)}
.small{font-size:14px}
.lab-steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:lab}
.lab-steps>li{counter-increment:lab}
.lab-steps h3{margin:0 0 6px}
.lab-steps h3::before{content:counter(lab) ". ";color:var(--muted)}
.lab-steps .toolbar{margin-top:10px}
.btn.lab-act{white-space:normal;text-align:left;height:auto}
.lab-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0}

/* ---------- calendar ---------- */
.cal-bar{align-items:center;gap:8px}
.cal-bar h2{font-size:22px;min-width:180px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin:14px 0}
.cal .dow{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px;background:var(--tint)}
.cal-day{min-height:92px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-day:nth-child(7n+1){border-left:0}
.cal-day.other{background:var(--tint)}
.cal-day .dn{font-size:12px;font-weight:800;align-self:flex-start}
.cal-day.today .dn{background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:0 6px}
.ev{display:block;font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--tint)}
.ev.showing,.ev.call{background:var(--mint-soft);color:var(--mint-ink)}
.ev.deadline,.ev.task{background:var(--sun-soft)}
.ev.repair{background:var(--coral-soft);color:var(--coral)}
@media (max-width:760px){.cal{display:none}}
.agenda-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0;border-top:1px solid var(--line)}
.agenda-row:first-child{border-top:0}
.grow{flex:1;min-width:0}

/* ---------- documents ---------- */
.docs{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.docs{grid-template-columns:1fr}}
.doc-list{display:grid;gap:2px}
.section-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.doc-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;font-weight:600;cursor:pointer;color:var(--ink)}
.doc-btn:hover{background:var(--tint)}
.doc-btn[aria-current="true"]{background:var(--ink);color:var(--bg)}
.tag.lock{display:inline-flex;align-items:center;gap:4px;margin-left:auto;white-space:nowrap}
.tag.lock .ic{width:14px;height:14px}
.doc-sheet{background:var(--tint);border-radius:14px;padding:18px}
.paper{display:block;width:100%;max-width:820px;height:min(78vh,900px);margin:0 auto 12px;border:0;border-radius:6px;background:#FFFDF9;box-shadow:var(--shadow)}
@media (max-width:640px){.doc-sheet{padding:8px}}
.lockcard{display:grid;gap:10px;justify-items:start}

/* ---------- books ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:8px}
@media (max-width:640px){.stats{grid-template-columns:1fr}}
.stat{display:grid;gap:4px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:150px}
.bar{display:grid;justify-items:center;gap:6px}
.pair{display:flex;gap:3px;align-items:flex-end;height:124px}
.pair i{display:block;width:16px;border-radius:5px 5px 0 0}
.pair i.inc,.legend .k.inc{background:var(--brand)}
.pair i.exp,.legend .k.exp{background:var(--muted)}
.bar span{font-size:12px;color:var(--muted);font-weight:700}
.legend{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:8px}
.legend .k{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:8px}
.legend .k:first-child{margin-left:0}
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px}
.tbl td{padding:10px;border-top:1px solid var(--line)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .good{color:var(--mint-ink)}

/* ---------- plan, team, security, drafts ---------- */
.feats li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 0}
.feats li.yes .ic{color:var(--mint)}
.feats li.no{color:var(--muted)}
.key{font:700 16px ui-monospace,Menlo,monospace;background:var(--tint);padding:4px 8px;border-radius:6px;word-break:break-all}
.steps-list{margin:0;padding-left:20px;display:grid;gap:8px}
.sub-h{font-size:17px;margin:14px 0 8px}
blockquote.draft{margin:0;padding:10px 14px;border-left:3px solid var(--sun);background:var(--sun-soft);border-radius:8px;white-space:pre-wrap}
</style>
</head>

const ICON = {

/* =====================================================================

const S = { me: null, rules: null, props: [], tenants: [], vendors: [], leases: [], threads: [], openCharges: [] };
const tz = () => (S.me && S.me.owner && S.me.owner.timezone) || 'America/Denver';
const isYmd = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const cap = (s) => (s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : '');
const humanize = (f) => cap(String(f || '').replace(/_/g, ' '));
const firstName = (n) => String(n || '').trim().split(/\s+/)[0] || '';
/** People by first name ("Lisa"); businesses by their whole name ("Mile High Handyman"). */
const callName = (name, role) => (role === 'vendor' ? String(name || '') : firstName(name));
// "Lisa Chen (+17205550111)" reads "Lisa Chen at (720) 555-0111", not "((720) 555-0111)".

function money(c) {

/** Cents to what goes in a dollar box: "2,750" or "2,750.50". */

const ymdIn = (d, zone) => new Intl.DateTimeFormat('en-CA', { timeZone: zone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);

}
const time = (s) => new Date(s).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: tz() });
/** Today: "2:14 PM". Yesterday: "Yesterday, 2:14 PM". Earlier: "Sun, Nov 1, 2:14 PM". */

}
function phoneText(p) { const m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(String(p || '')); return m ? `(${m[1]}) ${m[2]}-${m[3]}` : String(p || ''); }

const TRADES = [['general', 'General handyman'], ['plumbing', 'Plumbing'], ['electrical', 'Electrical'], ['hvac', 'Heating and cooling'], ['appliance', 'Appliances'], ['windows', 'Windows'], ['locks', 'Locks'], ['pest', 'Pest control'], ['roofing', 'Roofing'], ['exterior_cleaning', 'Exterior cleaning'], ['landscaping', 'Landscaping'], ['cleaning', 'Cleaning'], ['painting', 'Painting'], ['flooring', 'Flooring']];
const TRADE = Object.fromEntries(TRADES);
const ROLE = { tenant: 'Tenant', vendor: 'Vendor', prospect: 'Prospect', applicant: 'Applicant', owner: 'You', unknown: 'New contact' };
const CHANNEL = { sms: 'Text', email: 'Email', voice: 'Phone call', app: 'App' };
const HOME_STATUS = { occupied: ['Occupied', 'ok'], vacant: ['Vacant', 'warn'], listed: ['Listed for rent', ''], turnover: ['Between tenants', 'warn'] };
const LOCK = { smart: 'Smart lock (self-tours with one-time codes)', lockbox: 'Lockbox', none: 'Regular keys' };
const BILL_STATUS = { active: 'Active', past_due: 'Payment past due', canceled: 'Canceled', checkout_started: 'Checkout not finished' };
const WO_STATUS = {
  new: 'Just reported', triaged: 'Being sorted out', awaiting_vendor: 'Waiting for a vendor to reply', awaiting_owner: 'Waiting for your OK (see Today)',
  scheduled: 'Booked', in_progress: 'Work in progress', completed: 'Work done, waiting for the invoice', invoice_review: 'Invoice waiting for your review (see Today)',
  paid: 'Closed', cancelled: 'Cancelled',

/* =====================================================================
   Talking to the server. Same site only; every change carries the

   ===================================================================== */
class ApiError extends Error {

const STATUS_WORDS = {

  404: "We couldn't find that. It may have been removed. Refresh to see the latest.", 409: 'That was already done. Refresh to see the latest.',
  413: "That's too big to send. Try something shorter.", 429: 'Too many tries in a short time. Please wait a minute and try again.',

function signInAgain() {

async function api(method, path, body) {

const get = (path) => api('GET', path);
const post = (path, body) => api('POST', path, body === undefined ? {} : body);
const id = (s) => encodeURIComponent(s);

/* =====================================================================
   Toasts, busy buttons, small pieces
   ===================================================================== */
function toast(msg, kind) {
  const region = kind === 'error' ? $('#alerts') : $('#toasts');
  const t = h('div', { class: 'toast' + (kind === 'error' ? ' bad' : '') }, msg);
  region.append(t);
  // At most two at a time, so they never cover the screen.

async function busy(btn, label, fn) {
  if (!btn) return fn();

function clearErrors(form) {

function showError(form, e) {

  const key = e && e.field;
  let wrap = key ? form.querySelector(`[data-field="${CSS.escape(key)}"]`) : null;
  if (!wrap && key && key.includes('.')) wrap = form.querySelector(`[data-field="${CSS.escape(key.split('.')[0])}"]`);

/** Submit handler for a form: busy button, plain errors, never a page reload. */
function onSubmit(form, fn, working = 'Saving...') {

    const b = form.querySelector('button[type=submit]');

}

/* =====================================================================
   Screens and navigation
   ===================================================================== */
const TABS = ['today', 'rent', 'repairs', 'messages', 'leasing', 'homes', 'calendar', 'documents', 'books', 'settings', 'lab'];
const TITLE = { today: 'Today', rent: 'Rent', repairs: 'Repairs', messages: 'Messages', leasing: 'Leasing', homes: 'Homes', calendar: 'Calendar', documents: 'Documents', books: 'Books', settings: 'Settings', lab: 'Test lab' };
const LOADING = { today: 'Loading what needs you...', rent: 'Loading rent...', repairs: 'Loading repairs...', messages: 'Loading messages...', leasing: 'Loading leasing...', homes: 'Loading your homes...', calendar: 'Loading your calendar...', documents: 'Loading documents...', books: 'Loading your books...', settings: 'Loading settings...', lab: 'Loading the test lab...' };
/** Phones show four tabs and "More"; the rest open from a sheet. */
const MORE_TABS = ['leasing', 'homes', 'calendar', 'documents', 'books', 'settings'];
const pathFor = (tab, item) => (tab === 'today' ? '/app' : '/app/' + tab) + (item ? '/' + encodeURIComponent(item) : '');
function where() {
  const parts = location.pathname.split('/').filter(Boolean);
  const tab = TABS.includes(parts[1]) ? parts[1] : 'today';
  let item = null;
  if (tab === 'messages' && parts[2]) { try { item = decodeURIComponent(parts[2]); } catch { item = null; } }
  return { tab, item };
}
let drawSeq = 0, lastDraw = 0, lastPath = '', then = null;

/** Go to a screen. `next` runs once it's drawn (open a form, jump to a field). */
function go(tab, item, next) {
  const path = pathFor(tab, item);
  if (path !== location.pathname) history.pushState(null, '', path);
  then = next || null;
  show(true);
}
async function show(userNav) {
  if (location.pathname === '/app/' || location.pathname === '/app/today') history.replaceState(null, '', '/app');
  lastPath = location.pathname;
  const { tab, item } = where();
  $$('.nav a[data-tab]').forEach((a) => (a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  $('#more-btn').classList.toggle('on', MORE_TABS.includes(tab));
  $$('.view').forEach((v) => { v.hidden = v.dataset.view !== tab; });
  $('#page-title').textContent = TITLE[tab];
  document.title = `${TITLE[tab]} | KeyHelm`;
  const el = $('#view-' + tab);
  if (!el.childElementCount) fill(el, h('p', { class: 'loading', role: 'status' }, LOADING[tab]));
  if (userNav) { window.scrollTo(0, 0); $('#page-title').focus({ preventScroll: true }); }
  const mine = ++drawSeq;
  const stale = () => mine !== drawSeq;
  try {
    await VIEWS[tab](el, stale, item);
    if (stale()) return;
    lastDraw = Date.now();
    if (then) { const f = then; then = null; f(); }
  } catch (e) {
    if (stale() || (e && e.status === 401)) return;
    fill(el, errorCard(e));
  }
}
function refresh() { show(false); badges(); }

document.addEventListener('click', (e) => {
  const a = e.target instanceof Element ? e.target.closest('a[data-nav]') : null;
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const u = new URL(a.href, location.href);
  if (u.origin !== location.origin) return;
  e.preventDefault();
  if (u.pathname !== location.pathname) history.pushState(null, '', u.pathname);
  then = null;
  show(true);
});
window.addEventListener('popstate', () => { if (location.pathname !== lastPath) show(true); });
$('#refresh').addEventListener('click', () => { refresh(); toast('Up to date.'); });
$('#more-btn').addEventListener('click', () => openSheet('More', h('ul', { class: 'plain more-list' }, MORE_TABS.map((t) =>
  h('li', null, h('a', { href: pathFor(t), 'data-nav': '', class: 'btn ghost big', 'aria-current': t === where().tab ? 'page' : null, onclick: () => closeSheet() }, TITLE[t]))))));

/** The text version of a decision explains how to answer by text; the app has buttons for that. */
function cleanBody(s) {

    .map((line) => line.replace(/[^.!?\n]*\b(?:reply (?:YES|NO)|after (?:your )?YES|(?:YES|NO) (?:with the )?code)\b[^.!?\n]*[.!?]?\s*/gi, ' ').replace(/ {2,}/g, ' ').trim())
    .join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function decisionCard(a) {
  const hid = nid('d');
  const neutral = a.kind === 'application'; // fair housing: the app never nudges toward a choice on an applicant
  const fieldsFor = (v) => (a.fields || []).filter((f) => f.forOption === v);
  const choices = h('div', { class: 'options' });
  const panel = h('div', { class: 'panel', hidden: true });
  const back = () => { panel.hidden = true; panel.replaceChildren(); choices.hidden = false; const b = choices.querySelector('button'); if (b) b.focus(); };
  async function send(c, body, form, button) {
    await busy(button, 'Sending...', async () => {
      try {
        await post(`/api/approvals/${id(a.id)}`, { decision: c.value, ...body });
        toast(`Sent: ${c.label}. KeyHelm takes it from here.`);
        refresh();
      } catch (e) {
        if (e.status === 401) return;
        if (e.status === 409) { toast(e.message); refresh(); return; }
        if (form) showError(form, e); else toast(e.message, 'error');
      }
    });
  }
  function withFields(c, fs) {
    const form = h('form', { novalidate: true });
    for (const f of fs) form.append(f.type === 'deductions' ? deductionsEditor(f) : decisionField(f));
    const submit = h('button', { type: 'submit', class: 'btn big ' + (neutral ? 'choice' : 'primary') }, c.label);
    form.append(h('div', { class: 'actions' }, submit, btn('Back', back)));
    form.addEventListener('submit', (e) => { e.preventDefault(); clearErrors(form); send(c, collect(form, fs), form, submit); });
    fill(panel, form);
    panel.hidden = false;
    choices.hidden = true;
    (form.querySelector('input:not([readonly]),textarea') || submit).focus();
  }
  function confirmFirst(c) {
    const yes = h('button', { type: 'button', class: 'btn danger big' }, `Yes, ${c.label.charAt(0).toLowerCase()}${c.label.slice(1)}`);
    yes.addEventListener('click', () => send(c, {}, null, yes));
    fill(panel, h('p', { class: 'confirm-q' }, `Choose "${c.label}"? This can't be undone.`), h('div', { class: 'actions' }, yes, btn('Go back', back)));
    panel.hidden = false;
    choices.hidden = true;
    yes.focus();
  }
  for (const [i, c] of (a.choices || []).entries()) {
    const b = h('button', { type: 'button', class: 'btn ' + (neutral ? 'choice' : i === 0 ? 'primary' : 'ghost') }, c.label);
    b.addEventListener('click', () => {
      const fs = fieldsFor(c.value);
      if (fs.length) withFields(c, fs);
      else if (CAREFUL.has(c.value)) confirmFirst(c);
      else send(c, {}, null, b);
    });
    choices.append(b);
  }
  const body = cleanBody(a.body);
  return h('article', { class: 'card decision', 'aria-labelledby': hid },
    h('div', { class: 'kicker' }, tag(KIND_TAG[a.kind] || 'Decision', 'warn'), h('span', { class: 'meta' }, `Asked ${day(a.createdAt)}`)),
    h('h3', { id: hid }, a.title),
    body ? h('p', { class: 'body pre' }, body) : null,
    neutral ? h('p', { class: 'help' }, 'Compare the report with your written criteria. Use the same criteria for every applicant. KeyHelm never scores or recommends applicants.') : null,
    h('p', { class: 'question' }, QUESTION[a.kind] || 'What would you like to do?'),
    choices, panel);
}

function decisionField(f) {
  const dollarsType = f.type === 'dollars';
  let value = f.value === undefined || f.value === null ? '' : f.value;
  if (dollarsType && typeof value === 'number') value = value.toLocaleString('en-US', { maximumFractionDigits: 2 });
  return field({
    label: f.label, name: f.name, field: f.in === 'note' ? 'note' : f.name, type: f.type === 'date' ? 'date' : 'text', value,
    prefix: dollarsType ? '$' : undefined, inputmode: dollarsType ? 'decimal' : f.type === 'months' ? 'numeric' : undefined,
    help: f.help, readOnly: !!f.readOnly, optional: !f.required && !f.readOnly, min: f.type === 'date' ? today() : undefined, maxlength: f.type === 'text' ? 300 : undefined,

function leaseForm() {

      h('p', { class: 'help', id: 'lease-file-help' }, 'For a PDF or Word file: open it, select all, copy, and paste it below.')),
    field({ label: 'Lease text', name: 'text', type: 'textarea', rows: 10, placeholder: 'Paste the whole lease here.' }),
    actions('Save lease'));
  file.addEventListener('change', () => {
    const f = file.files && file.files[0];

    if (!f) return;

    reader.readAsText(f);
  });
  onSubmit(form, async () => {
    const text = form.elements.namedItem('text').value;

function memberRow(m, roles, reload) {
  const sel = h('select', { 'aria-label': `Access for ${m.name}` }, roles.map((r) => h('option', { value: r.id }, r.name)));
  sel.value = m.role;
  sel.addEventListener('change', async () => {
    try { await api('PATCH', `/api/team/${id(m.id)}`, { role: sel.value }); toast(`${m.name} now has ${sel.selectedOptions[0].textContent} access.`); }
    catch (e) { if (e.status !== 401) toast(e.message, 'error'); }
  });
  const resend = btn('New invite link', async () => {
    try { showInviteLink(m.name, await post(`/api/team/${id(m.id)}/invite`)); } catch (e) { if (e.status !== 401) toast(e.message, 'error'); }
  });
  let armed = false;
  const remove = btn('Remove', async () => {
    if (!armed) { armed = true; remove.textContent = `Tap again to remove ${firstName(m.name)}`; return; }
    try { await api('DELETE', `/api/team/${id(m.id)}`); toast(`${m.name} was removed and signed out.`); reload(); } catch (e) { if (e.status !== 401) toast(e.message, 'error'); }
  }, 'danger');
  return h('li', { class: 'card person' },
    h('div', { class: 'grow' }, h('h3', null, m.name), h('p', { class: 'meta' }, m.email, ' · ', m.status === 'invited' ? 'Invite sent' : m.lastLoginAt ? `Last signed in ${day(m.lastLoginAt)}` : 'Active', m.twoStep ? ' · Two-step on' : '')),
    h('div', { class: 'row-actions' }, sel, m.status === 'invited' ? resend : null, remove));
}
function inviteForm(roles, reload) {
  const form = h('form', { class: 'form card', novalidate: true }, h('h3', null, 'Invite someone'),
    h('div', { class: 'grid2' }, field({ label: 'Name', name: 'name', maxlength: 80, autocomplete: 'off' }), field({ label: 'Email', name: 'email', type: 'email', autocomplete: 'off' })),
    field({ label: 'Access', name: 'role', type: 'select', options: roles.map((r) => [r.id, r.name]), value: 'approver' }),
    actions('Send invite', false));
  onSubmit(form, async () => {
    const r = await post('/api/team', { name: val(form, 'name'), email: val(form, 'email'), role: val(form, 'role') });
    form.reset();
    showInviteLink(r.member.name, r);
    reload();
  }, 'Inviting...');
  return form;
}
function showInviteLink(name, r) {
  const link = h('input', { type: 'text', readOnly: true, value: r.inviteUrl, 'aria-label': 'Invite link' });
  openSheet(`Invite for ${name}`,
    h('p', null, r.emailed ? `We emailed ${firstName(name)} this link too. ` : "Email isn't set up yet, so send this link yourself. ", `It works once, until ${day(r.expiresAt)}.`),
    h('div', { class: 'field' }, link),
    h('div', { class: 'row-actions' }, btn([icon('copy'), 'Copy link'], () => copyText(r.inviteUrl, 'Link copied.')), btn('Done', () => closeSheet(), 'primary')));
}

function securitySection() {
  const twoBox = h('div', { class: 'card stack' });
  const devBox = h('div', { class: 'card' });
  const drawTwo = async () => {
    const st = await get('/api/me/two-step');
    if (st.enabled) {
      const form = h('form', { class: 'form', novalidate: true },
        h('p', null, tag('On', 'ok'), ` Since ${day(st.enabledAt)}. Every sign-in asks for a code from your authenticator app.`),
        field({ label: 'Your password', name: 'password', type: 'password', autocomplete: 'current-password', help: 'Needed to turn it off.' }),
        actions('Turn off two-step sign-in', false));
      onSubmit(form, async () => { await post('/api/me/two-step/disable', { password: form.elements.namedItem('password').value }); toast('Two-step sign-in is off.'); drawTwo(); });
      return fill(twoBox, form);
    }
    const start = btn('Set up two-step sign-in', () => busy(start, 'Starting...', async () => {
      try {
        const k = await post('/api/me/two-step/setup');
        const form = h('form', { class: 'form', novalidate: true },
          h('ol', { class: 'steps-list' },
            h('li', null, 'Open an authenticator app (Google Authenticator, 1Password, Authy or similar) and add an account with a setup key.'),
            h('li', null, 'Type this key: ', h('code', { class: 'key' }, k.secret)),
            h('li', null, 'Enter the 6-digit code the app shows.')),
          h('p', { class: 'help' }, 'On this phone? ', h('a', { href: k.uri }, 'Open it in my authenticator app')),
          field({ label: '6-digit code', name: 'code', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: 7 }),
          actions('Turn on', false));
        onSubmit(form, async () => { await post('/api/me/two-step/enable', { code: val(form, 'code') }); toast('Two-step sign-in is on.'); drawTwo(); });
        fill(twoBox, form);
      } catch (e) { if (e.status !== 401) toast(e.message, 'error'); }
    }), 'primary');
    fill(twoBox, h('p', null, tag('Off'), ' After your password, enter a code from an authenticator app on your phone. Recommended, since this account approves spending.'), h('div', { class: 'row-actions' }, start));
  };
  const drawDevices = async () => {
    const d = await get('/api/me/sessions');
    const others = btn('Sign out everywhere else', async () => {
      try { const r = await post('/api/me/sessions/others'); toast(`Signed out on ${plural(r.signedOut, 'other device')}.`); drawDevices(); } catch (e) { if (e.status !== 401) toast(e.message, 'error'); }
    });
    fill(devBox,
      h('ul', { class: 'plain stack' }, d.sessions.map((x) => h('li', { class: 'person' },
        h('div', { class: 'grow' }, h('h3', null, x.device), h('p', { class: 'meta' }, `${x.ip ? x.ip + ' · ' : ''}Last used ${stamp(x.lastSeenAt)}`)),
        x.current ? tag('This device', 'ok') : btn('Sign out', async () => {
          try { await api('DELETE', `/api/me/sessions/${id(x.id)}`); toast('Signed out on that device.'); drawDevices(); } catch (e) { if (e.status !== 401) toast(e.message, 'error'); }
        })))),
      d.sessions.length > 1 ? h('div', { class: 'row-actions' }, others) : null);
  };
  drawTwo().catch((e) => { if (e.status !== 401) fill(twoBox, errorCard(e)); });
  drawDevices().catch((e) => { if (e.status !== 401) fill(devBox, errorCard(e)); });
  return sectionWithId('set-security', 'Sign-in and security',
    h('h3', { class: 'sub-h' }, 'Two-step sign-in'), twoBox,
    h('h3', { class: 'sub-h' }, "Where you're signed in"), devBox);
}

/* =====================================================================
   TEST LAB (only on the local sandbox, npm run sandbox): text as anyone,
   jump the clock ahead, see every text that would have gone out.
   ===================================================================== */
const LAB_WHO = { tenant: 'Lisa (tenant)', prospect: 'Prospect', new_prospect: 'A new prospect', vendor: 'Vendor', owner: 'You (owner)' };
/** Try these 10 things: one per workflow. Each action is a text, a jump, or a lab helper. */
const LAB_STEPS = [
  { title: 'A repair', what: 'Lisa reports a torn screen. KeyHelm asks for a photo, texts your window vendor, and books it.', acts: [
    { who: 'tenant', body: 'The window screen in the back bedroom is torn.' }, { who: 'tenant', body: 'Here you go', photo: true },
    { who: 'vendor', body: 'YES Wed 10-12 $120' }, { who: 'vendor', body: 'DONE $120' }], then: 'Then open Repairs and Books.' },
  { title: 'Rent day', what: 'Lisa gets a friendly reminder on the due date.', acts: [{ jump: 'rent' }] },
  { title: 'Late rent', what: "After the grace period you're asked “Did rent arrive?”. Answer No on Today, then jump a day for the late fee choice.", acts: [{ jump: '1w' }, { jump: '1d' }] },
  { title: 'An application', what: 'Fill in the apply form as a made-up applicant, then send the sample screening report. Your decision shows on Today.', acts: [{ apply: true }, { screening: true }] },
  { title: 'A lease signing', what: 'Approve the applicant on Today with a start date. The signing link is in “What was sent” below: open it and sign as the tenant, then as you.', acts: [] },
  { title: 'A showing', what: 'A new prospect asks for a tour, passes the ID check, then picks a time.', acts: [
    { who: 'new_prospect', body: 'Is 88 Aspen Ct still available? Can I tour it this weekend?' }, { idCheck: true }, { who: 'prospect', body: '1' }] },
  { title: 'A renewal', what: "Answer the renewal question on Today (offer the same rent), then Lisa says yes.", acts: [{ jump: 'renewal' }, { who: 'tenant', body: "Yes, we'd like to renew." }] },
  { title: 'A move-out', what: 'Lisa gives notice. Jump to the lease end for the deposit steps on Today.', acts: [{ who: 'tenant', body: "I'm moving out when my lease ends." }, { jump: 'lease_end' }] },
  { title: 'The Monday report', what: 'Your weekly summary goes out Monday morning.', acts: [{ jump: 'monday' }] },
  { title: 'STOP and START', what: 'Lisa opts out of texts, then back in.', acts: [{ who: 'tenant', body: 'STOP' }, { who: 'tenant', body: 'START' }] },
];
const LAB_LINK = /(https?:\/\/[^\s]+)/g;
function labBody(text) {
  // Links back into this sandbox (signing pages, apply forms) open in a new tab.
  return text.split(LAB_LINK).map((part, i) => (i % 2 && /^http:\/\/(localhost|127\.0\.0\.1)[:/]/.test(part) ? h('a', { href: part, target: '_blank', rel: 'noopener' }, part) : part));
}
async function labRun(b, label, fn) {
  try {
    const r = await busy(b, label, fn);
    const n = r && typeof r.result === 'number' ? r.result : null;
    toast(n === null ? 'Done.' : n ? `Done. ${n} ${n === 1 ? 'text' : 'texts'} went out.` : 'Done. Nothing was sent.');
    refresh();
  } catch (e) { toast(e.message, 'error'); }
}
async function viewLab(el, stale) {
  const d = await get('/api/lab');
  if (stale()) return;
  const when = (iso, o = {}) => new Date(iso).toLocaleString('en-US', { timeZone: d.tz, weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', ...o });
  const ahead = d.aheadMs > 60_000 ? `${Math.floor(d.aheadMs / 86_400_000)} days, ${Math.floor((d.aheadMs % 86_400_000) / 3_600_000)} hours ahead of real time` : 'Real time';
  const jumpBtn = (k, cls = 'ghost') => {
    const j = d.jumps[k];
    const b = btn(j.label, () => labRun(b, 'Jumping...', () => post('/api/lab/jump', { to: k })), cls, { disabled: !j.at, title: j.at ? when(j.at) : j.why });
    return b;
  };
  const textBtn = (a) => {
    const person = d.people.find((p) => p.who === a.who);
    const name = a.who === 'new_prospect' ? 'a new prospect' : a.who === 'vendor' && person ? person.name : LAB_WHO[a.who];
    const b = btn(`Text as ${name}: “${a.body}”${a.photo ? ' + photo' : ''}`, () => labRun(b, 'Sending...', () => post('/api/lab/text', a)), 'ghost lab-act');
    return b;
  };
  const stepAct = (a) => {
    if (a.jump) { const b = jumpBtn(a.jump); b.textContent = `Jump: ${d.jumps[a.jump].label}`; return b; }
    if (a.who) return textBtn(a);
    if (a.apply) return d.applyUrl ? h('a', { class: 'btn ghost', href: d.applyUrl, target: '_blank', rel: 'noopener' }, `Open the apply form for ${d.vacantAddress}`) : null;
    if (a.screening) { const b = btn('Send the sample screening report', () => labRun(b, 'Sending...', () => post('/api/lab/screening'))); return b; }
    if (a.idCheck) { const b = btn('Pass the ID check', () => labRun(b, 'Checking...', () => post('/api/lab/id-check'))); return b; }
    return null;
  };

  // Text as anyone
  const who = field({ label: 'Who is texting?', name: 'who', type: 'select', options: Object.entries(LAB_WHO), value: 'tenant' });
  const form = h('form', { class: 'form', novalidate: true }, who,
    field({ label: 'Message', name: 'body', type: 'textarea', maxlength: 1000, placeholder: 'The toilet won’t stop running' }),
    h('label', { class: 'check' }, h('input', { type: 'checkbox', name: 'photo' }), ' Include a photo'),
    actions('Send text', false));
  onSubmit(form, async () => {
    const r = await post('/api/lab/text', { who: val(form, 'who'), body: val(form, 'body'), photo: form.elements.photo.checked });
    toast(r.result ? `Sent. ${r.result} ${r.result === 1 ? 'reply' : 'replies'} went out.` : 'Sent. Nothing went out.');
    refresh();
  }, 'Sending...');

  const resetBtn = btn('Reset demo data', () => {
    if (!confirm('Start over? Every change in the sandbox is wiped and the clock goes back to now.')) return;
    labRun(resetBtn, 'Resetting...', () => post('/api/lab/reset'));
  }, 'ghost');

  fill(el,
    h('p', { class: 'lead' }, 'Try every workflow in minutes. This is your local sandbox: texts and emails go nowhere, and nothing here touches the live app.'),
    section('Clock', null, h('div', { class: 'card' },
      h('p', null, h('strong', null, when(d.now, { year: 'numeric' }))),
      h('p', { class: 'muted small' }, ahead),
      h('p', null, h('strong', null, 'Jump ahead')),
      h('div', { class: 'toolbar' }, ['1h', '1d', '1w', 'rent', 'monday', 'renewal', 'lease_end'].map((k) => jumpBtn(k))),
      Object.values(d.jumps).filter((j) => !j.at).map((j) => h('p', { class: 'muted small' }, `${j.label}: ${j.why}.`)))),
    section('Try these 10 things', null, h('ol', { class: 'lab-steps' }, LAB_STEPS.map((st) => h('li', { class: 'card' },
      h('h3', null, st.title), h('p', null, st.what),
      st.acts.length ? h('div', { class: 'toolbar' }, st.acts.map(stepAct)) : null,
      st.then ? h('p', { class: 'muted small' }, st.then) : null)))),
    section('Text as anyone', null, h('div', { class: 'card' }, form,
      h('p', { class: 'muted small' }, 'Numbers: ', d.people.map((p, i) => [i ? ' · ' : '', `${p.name} ${p.phone}`])))),
    section('What was sent', null, d.sent.length ? h('ul', { class: 'list card' }, d.sent.map((m) => h('li', null,
      h('p', { class: 'small muted' }, when(m.at), ' · to ', h('strong', null, m.toName), m.channel === 'sms' ? '' : ` (${m.channel})`),
      h('p', { class: 'lab-body' }, labBody(m.body))))) : empty('Nothing yet. Send a text or jump ahead.')),
    section('Still waiting', null, d.waiting.length ? h('ul', { class: 'list card' }, d.waiting.map((w) => h('li', null, h('strong', null, cap(w.workflow.replace(/[-_]/g, ' '))), ': ', w.waitingFor)))
      : empty('Nothing is waiting.')),
    section('Start over', null, h('div', { class: 'card' }, h('p', null, 'Wipe the sandbox and load the demo data again.'), resetBtn)));
}

const VIEWS = { today: viewToday, rent: viewRent, repairs: viewRepairs, messages: viewMessages, leasing: viewLeasing, homes: viewHomes, calendar: viewCalendar, documents: viewDocuments, books: viewBooks, settings: viewSettings, lab: viewLab };

/* =====================================================================
   Start: offline banner, fresh data when you come back, first screen
   ===================================================================== */
const setOnline = () => { $('#offline').hidden = navigator.onLine !== false; };
window.addEventListener('offline', setOnline);
window.addEventListener('online', () => { setOnline(); toast("You're back online."); refresh(); });
setOnline();
const editing = () => sheet.open || !!$('main .panel:not([hidden])') || !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('main form'));
const stale60 = () => document.visibilityState === 'visible' && Date.now() - lastDraw > 60_000 && !editing() && navigator.onLine !== false;
document.addEventListener('visibilitychange', () => { if (stale60()) refresh(); });
setInterval(() => { if (stale60()) refresh(); }, 120_000);

show(false);
badges();
})();
</script>
</body>
